# Credify local stack. Copy .env.example to .env and fill in the values first.
#   docker compose up --build        → db + migrations + api on http://localhost:8000
#   docker compose up db             → database only (for running the API/tests on the host)
#   docker compose run --rm seed     → synthetic demo data (add --reset to replace existing data)
name: credify

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-credify_test}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      CREDIFY_ENVIRONMENT: ${CREDIFY_ENVIRONMENT:-development}
      CREDIFY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CREDIFY_JWT_SECRET: ${CREDIFY_JWT_SECRET:?set CREDIFY_JWT_SECRET in .env}
      CREDIFY_CORS_ORIGINS: ${CREDIFY_CORS_ORIGINS:-http://localhost:5173}
      CREDIFY_COOKIE_SECURE: ${CREDIFY_COOKIE_SECURE:-false}
      CREDIFY_LOG_LEVEL: ${CREDIFY_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *api-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot demo data. Not started by `up`; run it with `docker compose run --rm seed`.
  # Generated demo passwords are written to ./.local/demo-credentials.txt (git-ignored).
  seed:
    build:
      context: ./backend
    profiles: ["seed"]
    entrypoint: ["python", "-m", "scripts.seed_demo_data", "--credentials-file", "/app/.local/demo-credentials.txt"]
    command: []
    environment: *api-env
    volumes:
      - ./.local:/app/.local
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
