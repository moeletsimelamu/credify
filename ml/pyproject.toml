[project]
name = "credify-ml"
version = "0.1.0"
description = "Credify offline ML pipeline: synthetic data, shared features, model training (educational)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "credify-backend",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]
notebook = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credify_ml"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# The shared feature builder lives in the backend, so training and serving use one definition.
credify-backend = { path = "../backend", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: trains models on a generated dataset"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "NPY", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
