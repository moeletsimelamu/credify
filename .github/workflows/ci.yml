name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: credify_test
          POSTGRES_USER: credify
          POSTGRES_PASSWORD: ci-only-throwaway-password  # ephemeral CI container, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U credify -d credify_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CREDIFY_TEST_DATABASE_URL: postgresql+psycopg://credify:ci-only-throwaway-password@127.0.0.1:5432/credify_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.9
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy app tests scripts
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: OpenAPI document matches the committed copy (frontend contract)
        run: uv run python -m scripts.export_openapi --check

  frontend:
    name: Frontend (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Prettier
        run: npm run format:check
      - name: ESLint (incl. jsx-a11y)
        run: npx eslint . --max-warnings 0
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run coverage
      - name: Build
        run: npm run build

  ml:
    name: ML (lint, types, tests, reproducibility)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.9
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy credify_ml tests
      - name: Tests
        run: uv run pytest
      - name: Generate the dataset (seed 20261118)
        run: uv run python -m credify_ml.generate
      - name: Reproduce the committed training metrics
        run: uv run python -m credify_ml.train --check
      - name: Reproduce the committed evaluation and fairness reports
        run: |
          uv run python -m credify_ml.evaluate --check
          uv run python -m credify_ml.evaluate > /dev/null
          uv run python -m credify_ml.fairness --check

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose
